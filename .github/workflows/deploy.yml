# .github/workflows/deploy.yml
# ─────────────────────────────────────────────────────────────────────────────
# Automatic deployment to GitHub Pages on every push to `main`.
#
# Prerequisites (do once in your repo):
#   Settings → Pages → Source: "GitHub Actions"
#   (Workflow permissions can stay "Read": each job below asks for only
#   what it needs.)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from Actions tab
  # Every 6 hours: refresh the list of masjids people can follow (newly
  # approved self-serve masjids, and names masjids have changed).
  # The app's code is rebuilt identically, so screens don't re-download it.
  schedule:
    - cron: '17 */6 * * *'

# Each job gets only what it needs (below): the build, which installs
# packages and reads the registration sheet, can't deploy.
permissions:
  contents: read

concurrency:
  group: pages
  # Let a deploy that has started finish (a scheduled run mustn't cancel it).
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to a commit; Dependabot keeps them current.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The token isn't left in .git/config for install scripts to find.
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Set the base path to your repo name for GitHub Pages:
          # e.g. if your repo is github.com/you/prayer-times-tv → /prayer-times-tv/
          VITE_BASE_URL: /${{ github.event.repository.name }}/
          # The Settings PIN ends up in the public JavaScript, so it isn't a
          # secret: set it as the variable VITE_SETTINGS_PIN. (A secret of
          # that name, from older setups, still works.)
          VITE_SETTINGS_PIN: ${{ vars.VITE_SETTINGS_PIN || secrets.VITE_SETTINGS_PIN }}
          # Footer test buttons: off unless the variable is 'true'.
          VITE_SHOW_TEST_BUTTONS: ${{ vars.VITE_SHOW_TEST_BUTTONS || 'false' }}
          # Shared masjid settings (docs/remote-settings.md). Set in GitHub:
          # Settings → Secrets and variables → Actions → Variables.
          #   SETTINGS_SOURCE   none | sheet | cloudflare
          #   SETTINGS_API_URL  the Worker's address (cloudflare only)
          VITE_SETTINGS_SOURCE: ${{ vars.SETTINGS_SOURCE || 'none' }}
          VITE_SETTINGS_API_URL: ${{ vars.SETTINGS_API_URL }}
          # Self-serve masjids (Google Sheet source):
          #   REGISTER_FORM_URL       the registration form's pre-filled link
          #   REGISTRATIONS_SHEET_ID  the form's responses sheet, where every
          #                           self-serve masjid's signed settings are
          #                           kept (public by design: view-only, and
          #                           screens apply only signed rows)
          VITE_REGISTER_FORM_URL: ${{ vars.REGISTER_FORM_URL }}
          VITE_REGISTRATIONS_SHEET_ID: ${{ vars.REGISTRATIONS_SHEET_ID }}

      - name: Build the masjid list
        # dist/masjids.json: public/masjids.json plus approved self-serve
        # masjids, with each masjid's own name and city
        # (scripts/build-directory.mjs).
        run: node scripts/build-directory.mjs --registry public/masjids.json --out dist/masjids.json
        env:
          #   REGISTRATIONS_SHEET_ID  the registration form's responses sheet
          REGISTRATIONS_SHEET_ID: ${{ vars.REGISTRATIONS_SHEET_ID }}
          SETTINGS_SOURCE: ${{ vars.SETTINGS_SOURCE || 'none' }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
